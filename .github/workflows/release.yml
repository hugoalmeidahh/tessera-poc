name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            command: npm run dist:mac -- --arm64 --publish never
          - name: macOS Intel
            os: macos-13
            command: npm run dist:mac -- --x64 --publish never
          - name: Linux x64
            os: ubuntu-latest
            command: npm run dist:linux -- --x64 --publish never
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win -- --x64 --publish never

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
